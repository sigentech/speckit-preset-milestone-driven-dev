schema_version: "1.0"
preset:
  id: "milestone-driven-dev"
  name: "Milestone-Driven Development Workflow"
  version: "1.5.0"
  description: "Milestone-first customization of spec-kit: a milestones plan gates all specify runs (one milestone = one module = one spec), a UI prototype stage iterates and freezes the demo before specify, analysis reports accumulate per spec with a clarify/plan/tasks rectification loop, every spec ends with an implementation & acceptance report, and git flow is main/develop + feature/Mx with DevOps-style iteration and hotfix paths. A setup command injects a workflow-navigator block into the project's AGENTS.md so the agent proactively reminds the user of current stage and available next actions (required + optional) after every reply. Two anytime side skills — speckit.grill (relentless design-tree interview) and speckit.brainstorm (dialogue-first design doc with builder check and browser visual companion) — let the user deep-dive or brainstorm at any stage, with conclusions always sinking into the artifact of the stage they were invoked in. Includes an optional PRD command for greenfield projects (disabled by default)."
  author: "luoxi591"
  repository: "https://github.com/sigentech/speckit-preset-milestone-driven-dev"
  license: "MIT"
requires:
  speckit_version: ">=0.5.0"
provides:
  templates:
    - type: "template"
      name: "milestones-template"
      file: "templates/milestones-template.md"
      description: "项目里程碑规划文件：全局技术栈、里程碑总表（含依赖 DAG 与并行分组）、每个里程碑的实现功能/技术栈/用户验收指导/依赖关系/状态。一个里程碑对应一个 specify。"
    - type: "template"
      name: "analysis-report-template"
      file: "templates/analysis-report-template.md"
      description: "speckit.analyze 分析报告：每 spec 一份，按轮次追加；问题按 Critical/High/Medium/Low 分级，附消除建议与消除结果记录。"
    - type: "template"
      name: "implementation-report-template"
      file: "templates/implementation-report-template.md"
      description: "实现与验收报告：实现概述、自动化验证结果、关键技术决策、待人工验收项清单及逐项操作指南、产物位置速查。"
    - type: "template"
      name: "prototype-template"
      file: "templates/prototype-template.md"
      description: "UI Demo 说明清单：屏清单（SCR-nn）、用户旅程走查、基线偏离记录、迭代记录、开发期变更分级留痕、冻结与归档记录。"
    - type: "template"
      name: "prd-template"
      file: "templates/prd-template.md"
      description: "产品需求文档（可选，默认不启用）：背景目标、用户画像与旅程、MoSCoW 功能需求、成功度量、范围外、里程碑规划输入建议。"
    - type: "template"
      name: "ux-baseline-template"
      file: "templates/ux-baseline-template.md"
      description: "UX 设计基线：产品气质、设计令牌、布局导航、组件约定、交互文案范式。新项目建立基线用，全项目里程碑 Demo 的继承源。"
    - type: "template"
      name: "agents-reminder-template"
      file: "templates/agents-reminder-template.md"
      description: "AGENTS.md 工作流领航提醒块：状态检测表（13 态）+ 输出格式约束。由 speckit.setup 幂等注入项目根 AGENTS.md，Agent 每次回复末尾据此提示当前环节与主线/可选操作。"
    - type: "template"
      name: "brainstorm-builder-check-prompt"
      file: "templates/brainstorming/builder-check-prompt.md"
      description: "speckit.brainstorm 的建造者检查提示词：设计文档写好后派发给全新子代理做'拿文档能否直接做计划'的盲审，带回遗留问题清单。"
    - type: "template"
      name: "brainstorm-visual-companion"
      file: "templates/brainstorming/visual-companion.md"
      description: "speckit.brainstorm 的可视化伴侣指南：浏览器标签页内展示稿图/示意图/并排方案的完整操作说明；配套脚本位于其同级 scripts/ 目录（server.cjs/helper.js/frame-template.html/start-server.sh/stop-server.sh）。"
    - type: "template"
      name: "explore-note-template"
      file: "templates/explore-note-template.md"
      description: "前期探索产出登记文件（docs/explore/）：带 frontmatter 吸收状态机（pending-absorb/absorbed），grill/brainstorm 在宪法/PRD/里程碑规划之前的产出统一落此目录，speckit.prd 与 speckit.milestones init 自动扫描吸收并回写状态。"
    - type: "command"
      name: "speckit.setup"
      file: "commands/speckit.setup.md"
      description: "项目初始化收尾——向项目根 AGENTS.md 幂等注入工作流领航提醒块（inject/remove/status）。preset add 之后、constitution 之前执行一次。"
    - type: "command"
      name: "speckit.milestones"
      file: "commands/speckit.milestones.md"
      description: "里程碑规划命令——init（生成里程碑文件，位于 constitution 之后、首个 specify 之前）、add（迭代新增）、revise（调整/重排）、status。一个里程碑=一个功能模块=一个 specify；依赖 DAG 支持并行。"
    - type: "command"
      name: "speckit.prototype"
      file: "commands/speckit.prototype.md"
      description: "UI Demo 先行——gen（轻量 HTML Demo）、freeze（冻结）、skip（引擎型降级）、status。位于 milestones 之后、specify 之前；Demo 冻结是 specify 的前置门禁；含开发期 UI 变更分级协议。"
    - type: "command"
      name: "speckit.prd"
      file: "commands/speckit.prd.md"
      description: "【可选，默认不启用】生成产品需求文档（PRD）——仅功能愿景来源缺失的新项目启用，产出作为 milestones init 的输入。"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "（定制覆盖）创建功能规格：强制关联里程碑、按 specs/NNN-mX-短名/ 建目录、创建并切换 feature/Mx 分支、回写里程碑状态。"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "（定制覆盖）技术计划：追加'Demo 屏 → 真实组件映射表'（prototype 存在时必填），禁止设计出 Demo 没有的交互。"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "（定制覆盖）跨产物一致性分析：报告输出至 ./.prepare/docs/specs-analysis-repo/，每 spec 一份按轮次追加；问题分 Critical/High/Medium/Low 并附消除建议。"
    - type: "command"
      name: "speckit.rectify"
      file: "commands/speckit.rectify.md"
      description: "问题消除编排：依据最新一轮分析报告，依次调用 clarify→plan→tasks 消除问题（Critical~Low 全部立即消除），记录消除结果，防引入新问题，随后重跑 analyze。"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "（定制覆盖）编码实现：核心流程执行完毕后，自动接续 speckit.acceptance 生成《实现与验收报告》。"
    - type: "command"
      name: "speckit.acceptance"
      file: "commands/speckit.acceptance.md"
      description: "生成 implementation-report.md：自动化验证结果、技术决策、待人工验收项清单及逐项操作指南、产物速查；随 docs 提交并推送远程。"
    - type: "command"
      name: "speckit.release"
      file: "commands/speckit.release.md"
      description: "里程碑发布：验收全过后，feature/Mx 并入 develop 与 main、打 tag、推送远程、回写里程碑状态，列出新解锁的可并行里程碑。"
    - type: "command"
      name: "speckit.hotfix"
      file: "commands/speckit.hotfix.md"
      description: "Bug 修复路径：里程碑内（fix/Mx-短名）与跨里程碑（fix/cross-短名）双路径，含影响面评估、回归测试、向 develop/main 及全部活跃 feature 分支传播。"
    - type: "command"
      name: "speckit.grill"
      file: "commands/speckit.grill.md"
      description: "【旁路，任意环节可用】拷问式深挖：设计树 + 逐轮前沿提问，压力测试一个计划/决策/想法直到无隐含假设；共识结论沉淀到调用时所在环节的正式产物。"
    - type: "command"
      name: "speckit.brainstorm"
      file: "commands/speckit.brainstorm.md"
      description: "【旁路，任意环节可用】头脑风暴：先对话搞清楚要什么/为什么 → 摆出做法 → 设计文档（含建造者检查）→ 用户批准 → 路由回当前环节主线命令；可选浏览器可视化伴侣。"
tags: ["workflow", "milestones", "devops", "gitflow", "analysis", "brainstorming"]
